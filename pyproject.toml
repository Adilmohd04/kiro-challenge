[project]
name = "sentinelnow"
version = "0.1.0"
description = "An AI-agent safety gateway for ServiceNow: preview, risk-score, policy-gate, audit, and kill-switch every write an AI agent makes."
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.9.2",
  "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "hypothesis==6.112.1",
  "ruff==0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelnow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
